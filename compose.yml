services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sibuta-app
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
    volumes:
      - ./:/var/www/html
    networks:
      - proxy

  nginx:
    image: nginx:alpine
    container_name: sibuta-nginx
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
    depends_on:
      - app
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:80"
    networks:
      - proxy

networks:
  proxy:
    external: true
